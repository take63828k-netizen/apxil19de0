<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 270" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="270" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">織田信長の統一事業の流れ</text>
<rect x="20" y="100" width="175" height="100" rx="12" fill="#B4ECE3"/>
<text x="107.5" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">桶狭間の戦い</text>
<text x="107.5" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">（1560年）</text>
<line x1="195" y1="150" x2="197" y2="150" stroke="#4A4259" stroke-width="3"/>
<polygon points="210,150 197,145 197,155" fill="#4A4259"/>
<rect x="210" y="100" width="175" height="100" rx="12" fill="#FFD97D"/>
<text x="297.5" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">室町幕府滅亡</text>
<text x="297.5" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">（1573年）</text>
<line x1="385" y1="150" x2="387" y2="150" stroke="#4A4259" stroke-width="3"/>
<polygon points="400,150 387,145 387,155" fill="#4A4259"/>
<rect x="400" y="100" width="175" height="100" rx="12" fill="#E8A0BF"/>
<text x="487.5" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">長篠の戦い</text>
<text x="487.5" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">（1575年）</text>
<line x1="575" y1="150" x2="577" y2="150" stroke="#4A4259" stroke-width="3"/>
<polygon points="590,150 577,145 577,155" fill="#4A4259"/>
<rect x="590" y="100" width="175" height="100" rx="12" fill="#B4ECE3"/>
<text x="677.5" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">本能寺の変</text>
<text x="677.5" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">（1582年）</text>
<text x="370" y="240" text-anchor="middle" font-size="14" fill="#4A4259">安土城は室町幕府滅亡後、統一事業の拠点として築かれた</text>
</svg>
