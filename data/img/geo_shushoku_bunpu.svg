<text x="200.0" y="147" text-anchor="middle" font-size="13" fill="#4A4259">主食：（A）</text>
<rect x="400" y="80" width="340" height="100" rx="12" fill="#C9E4FF"/>
<text x="570.0" y="125" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">ヨーロッパ・北アメリカなど</text>
<text x="570.0" y="147" text-anchor="middle" font-size="13" fill="#4A4259">主食：小麦（パン・パスタ）</text>
