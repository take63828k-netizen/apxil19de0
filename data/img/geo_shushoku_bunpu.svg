<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 320" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="320" fill="#FFFFFF"/>
<text x="385" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">世界の主な主食（模式）</text>
<rect x="30" y="80" width="340" height="100" rx="12" fill="#FFD97D"/>
