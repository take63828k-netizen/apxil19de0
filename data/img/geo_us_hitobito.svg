<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 340" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="340" fill="#FFFFFF"/>
<text x="385" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">アメリカ合衆国の人々のなりたち（模式）</text>
<rect x="275" y="50" width="220" height="70" rx="12" fill="#FFD97D"/>
<text x="385.0" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">（A）</text>
<text x="385.0" y="103" text-anchor="middle" font-size="13" fill="#4A4259">ヨーロッパ人が来る前から暮らす</text>
<rect x="20" y="150" width="220" height="70" rx="12" fill="#C9E4FF"/>
<text x="130.0" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">ヨーロッパ系</text>
<text x="130.0" y="203" text-anchor="middle" font-size="13" fill="#4A4259">入植・移民としてきた人々</text>
<rect x="275" y="150" width="220" height="70" rx="12" fill="#B4ECE3"/>
<text x="385.0" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">アメリカ合衆国</text>
<text x="385.0" y="203" text-anchor="middle" font-size="13" fill="#4A4259">多民族国家</text>
<rect x="530" y="150" width="220" height="70" rx="12" fill="#E8A0BF"/>
<text x="640.0" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">アフリカ系</text>
<text x="640.0" y="203" text-anchor="middle" font-size="13" fill="#4A4259">奴隷にされた人々の子孫</text>
<rect x="20" y="250" width="220" height="70" rx="12" fill="#BEE3B4"/>
<text x="130.0" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">アジア系</text>
<text x="130.0" y="303" text-anchor="middle" font-size="13" fill="#4A4259">近年も移民が増えている</text>
<rect x="530" y="250" width="220" height="70" rx="12" fill="#FFC49B"/>
<text x="640.0" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">ヒスパニック</text>
<text x="640.0" y="303" text-anchor="middle" font-size="13" fill="#4A4259">中南米から移り住んだ人々</text>
