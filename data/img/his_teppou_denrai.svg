<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 220" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="220" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">鉄砲伝来（1543年）の経路（模式）</text>
<rect x="60" y="90" width="250" height="100" rx="12" fill="#B4ECE3"/>
<text x="185.0" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">中国船（明船）</text>
<text x="185.0" y="156" text-anchor="middle" font-size="13" fill="#4A4259">ポルトガル人が乗船</text>
<line x1="320" y1="140" x2="387" y2="140" stroke="#4A4259" stroke-width="3"/>
<polygon points="400,140 387,135 387,145" fill="#4A4259"/>
<text x="360.0" y="132.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E6B8C">漂着</text>
<rect x="410" y="90" width="300" height="100" rx="12" fill="#FFD97D"/>
<text x="560.0" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">種子島（薩摩国）</text>
<text x="560.0" y="156" text-anchor="middle" font-size="13" fill="#4A4259">鉄砲が伝わる</text>
</svg>
