<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 250" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="250" fill="#FFFFFF"/>
<text x="385" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">焼畑農業の流れ（模式）</text>
<rect x="20" y="90" width="170" height="110" rx="12" fill="#B4ECE3"/>
<text x="105.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">森林・草原を焼く</text>
<line x1="190" y1="145" x2="200" y2="145" stroke="#4A4259" stroke-width="3"/>
<polygon points="210,145 200,141 200,149" fill="#4A4259"/>
<rect x="210" y="90" width="170" height="110" rx="12" fill="#FFD97D"/>
<text x="295.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">灰が（A）になる</text>
<line x1="380" y1="145" x2="390" y2="145" stroke="#4A4259" stroke-width="3"/>
<polygon points="400,145 390,141 390,149" fill="#4A4259"/>
<rect x="400" y="90" width="170" height="110" rx="12" fill="#BEE3B4"/>
<text x="485.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">作物を栽培</text>
<line x1="570" y1="145" x2="580" y2="145" stroke="#4A4259" stroke-width="3"/>
<polygon points="590,145 580,141 580,149" fill="#4A4259"/>
<rect x="590" y="90" width="170" height="110" rx="12" fill="#E8A0BF"/>
<text x="675.0" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">数年で土地がやせる</text>
<text x="675.0" y="160" text-anchor="middle" font-size="13" fill="#4A4259">別の場所へ移る</text>
</svg>
