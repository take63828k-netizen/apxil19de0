<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="760" height="350" fill="#FFFFFF"/>
<text x="370" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">株式会社のしくみ</text>
<rect x="20" y="100" width="180" height="80" rx="12" fill="#B4ECE3"/>
<text x="110.0" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">出資者</text>
<text x="110.0" y="158" text-anchor="middle" font-size="13" fill="#4A4259">（株主）</text>
<rect x="280" y="100" width="200" height="80" rx="12" fill="#FFD97D"/>
<text x="380.0" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">株式会社</text>
<text x="380.0" y="158" text-anchor="middle" font-size="13" fill="#4A4259">株式を発行して資金を調達</text>
<rect x="560" y="100" width="180" height="80" rx="12" fill="#E8A0BF"/>
<text x="650.0" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">株主総会</text>
<text x="650.0" y="157" text-anchor="middle" font-size="13" fill="#4A4259">経営方針・役員を決定</text>
<line x1="200" y1="140" x2="265" y2="140" stroke="#4A4259" stroke-width="3"/>
<polygon points="278,140 265,135 265,145" fill="#4A4259"/>
<text x="239.0" y="132.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E6B8C">出資</text>
<line x1="480" y1="140" x2="545" y2="140" stroke="#4A4259" stroke-width="3"/>
<polygon points="558,140 545,135 545,145" fill="#4A4259"/>
<rect x="280" y="230" width="200" height="70" rx="12" fill="#F8F6FF" stroke="#4A4259" stroke-width="2"/>
<text x="380.0" y="260" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">利潤</text>
<text x="380.0" y="282" text-anchor="middle" font-size="13" fill="#4A4259">事業で得たもうけ</text>
<line x1="380" y1="180" x2="380" y2="215" stroke="#4A4259" stroke-width="3"/>
<polygon points="380,228 385,215 375,215" fill="#4A4259"/>
<rect x="20" y="230" width="180" height="70" rx="12" fill="#F8F6FF" stroke="#4A4259" stroke-width="2"/>
<text x="110.0" y="260" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">配当</text>
<text x="110.0" y="282" text-anchor="middle" font-size="13" fill="#4A4259">株主が受け取る</text>
<line x1="278" y1="265" x2="215" y2="265" stroke="#4A4259" stroke-width="3"/>
<polygon points="202,265 215,270 215,260" fill="#4A4259"/>
<text x="370" y="330" text-anchor="middle" font-size="13" fill="#4A4259">株主は、出資した金額の範囲内でしか責任を負わない（有限責任）</text>
</svg>
