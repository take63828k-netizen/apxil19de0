<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 350" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="350" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">二十一か条の要求（1915年）の主な内容</text>
<rect x="40" y="90" width="320" height="90" rx="12" fill="#E8A0BF"/>
<text x="200.0" y="131" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">山東省のドイツ権益を</text>
<text x="200.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">日本が引き継ぐ</text>
<rect x="410" y="90" width="320" height="90" rx="12" fill="#B4ECE3"/>
<text x="570.0" y="131" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">旅順・大連の</text>
<text x="570.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">租借期限を延長する</text>
<rect x="220" y="210" width="320" height="80" rx="12" fill="#FFD97D"/>
<text x="380.0" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">南満州における</text>
<text x="380.0" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">日本の権益を拡大する</text>
<text x="370" y="320" text-anchor="middle" font-size="14" fill="#4A4259">中国国内で強い反発が起こった</text>
</svg>
