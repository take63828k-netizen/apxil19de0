<polygon points="180,220 250,140 320,220" fill="#F8F6FF"/>
<text x="250" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">カルデラ（くぼ地）</text>
<rect x="460" y="100" width="260" height="90" rx="12" fill="#B4ECE3"/>
<text x="590.0" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">カルデラの中に</text>
