<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 270" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="270" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">世界恐慌（1929年）への各国の対応</text>
<rect x="30" y="90" width="210" height="100" rx="12" fill="#B4ECE3"/>
<text x="135.0" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">アメリカ</text>
<text x="135.0" y="157" text-anchor="middle" font-size="13" fill="#4A4259">ニューディール政策（公共事業の拡大）</text>
<rect x="270" y="90" width="230" height="100" rx="12" fill="#E8A0BF"/>
<text x="385.0" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">イギリス・フランス</text>
<text x="385.0" y="155" text-anchor="middle" font-size="13" fill="#4A4259">ブロック経済（本国と植民地で経済圏）</text>
<rect x="530" y="90" width="210" height="100" rx="12" fill="#FFD97D"/>
<text x="635.0" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">ソ連</text>
<text x="635.0" y="157" text-anchor="middle" font-size="13" fill="#4A4259">五か年計画（影響をほとんど受けず）</text>
<text x="370" y="240" text-anchor="middle" font-size="14" fill="#4A4259">対応の違いが、その後の国際関係の対立につながった</text>
</svg>
