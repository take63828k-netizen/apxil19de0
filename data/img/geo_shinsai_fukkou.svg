<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 230" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="230" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">東日本大震災（2011年）からの復興</text>
<rect x="60" y="90" width="300" height="110" rx="12" fill="#E8A0BF"/>
<text x="210.0" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">地震・津波の被害</text>
<text x="210.0" y="160" text-anchor="middle" font-size="13" fill="#4A4259">東北地方の太平洋沿岸</text>
<line x1="370" y1="145" x2="417" y2="145" stroke="#4A4259" stroke-width="3"/>
<polygon points="430,145 417,140 417,150" fill="#4A4259"/>
<text x="400.0" y="137.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E6B8C">対策</text>
<rect x="440" y="90" width="290" height="110" rx="12" fill="#B4ECE3"/>
<text x="585.0" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">防潮堤の整備</text>
<text x="585.0" y="160" text-anchor="middle" font-size="13" fill="#4A4259">沿岸の防災対策</text>
</svg>
