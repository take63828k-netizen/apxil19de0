<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="780" height="260" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">大正デモクラシー期の社会運動</text>
<rect x="40" y="90" width="220" height="90" rx="12" fill="#E8A0BF"/>
<text x="150.0" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">全国水平社</text>
<text x="150.0" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">（1922年）</text>
<text x="150.0" y="159" text-anchor="middle" font-size="13" fill="#4A4259">部落差別の撤廃を目指す</text>
<rect x="280" y="90" width="220" height="90" rx="12" fill="#B4ECE3"/>
<text x="390.0" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">新婦人協会</text>
<text x="390.0" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">（1920年）</text>
<text x="390.0" y="159" text-anchor="middle" font-size="13" fill="#4A4259">女性の参政権などを求める</text>
<rect x="520" y="90" width="220" height="90" rx="12" fill="#FFD97D"/>
<text x="630.0" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">労働争議・小作争議</text>
<text x="630.0" y="149" text-anchor="middle" font-size="13" fill="#4A4259">労働条件の改善を求める</text>
<text x="370" y="230" text-anchor="middle" font-size="14" fill="#4A4259">それぞれ異なる立場から、社会の民主化を求めた</text>
</svg>
