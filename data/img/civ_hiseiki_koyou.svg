<text x="590.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">2020</text>
<text x="370" y="330" text-anchor="middle" font-size="12" fill="#4A4259">非正規雇用（パート・アルバイト・派遣など）の割合が増加（おおよその傾向）</text>
