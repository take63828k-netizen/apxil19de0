<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 355" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="355" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">雇用者にしめる非正規雇用の割合の変化（模式）</text>
<line x1="100" y1="280" x2="660" y2="280" stroke="#4A4259" stroke-width="2"/>
<rect x="132" y="179" width="77" height="101" fill="#B4ECE3" stroke="#4A4259" stroke-width="1.5"/>
<text x="170.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">1990</text>
<rect x="272" y="149" width="77" height="131" fill="#B4ECE3" stroke="#4A4259" stroke-width="1.5"/>
<text x="310.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">2000</text>
<rect x="412" y="109" width="77" height="171" fill="#FFD97D" stroke="#4A4259" stroke-width="1.5"/>
<text x="450.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">2010</text>
