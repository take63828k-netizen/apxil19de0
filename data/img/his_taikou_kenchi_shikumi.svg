<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="660" height="230" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">太閤検地の仕組み</text>
<rect x="30" y="90" width="260" height="110" rx="12" fill="#B4ECE3"/>
<text x="160.0" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">役人が土地を測量</text>
<text x="160.0" y="160" text-anchor="middle" font-size="13" fill="#4A4259">面積・収穫量を検地帳に記録</text>
<line x1="300" y1="145" x2="347" y2="145" stroke="#4A4259" stroke-width="3"/>
<polygon points="360,145 347,140 347,150" fill="#4A4259"/>
<rect x="370" y="90" width="260" height="110" rx="12" fill="#FFD97D"/>
<text x="500.0" y="141" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">耕作者（農民）</text>
<text x="500.0" y="161" text-anchor="middle" font-size="13" fill="#4A4259">検地帳に登録され年貢を負担</text>
</svg>
