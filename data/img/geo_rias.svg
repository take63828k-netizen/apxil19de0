<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="680" height="330" fill="#FFFFFF"/>
<text x="370" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">リアス海岸の模式図</text>
<path d="M 60,150 L 130,110 L 170,180 L 220,120 L 260,190 L 310,130 L 350,200 L 400,140 L 620,140 L 620,260 L 60,260 Z" fill="#C9E4FF" stroke="#4A4259" stroke-width="1.5"/>
<text x="150" y="230" text-anchor="middle" font-size="13" fill="#4A4259">陸地（山地が海に沈んだ地形）</text>
<text x="450" y="100" text-anchor="middle" font-size="13" fill="#2E6B8C">海（波が穏やかで水深がある）</text>
<text x="200" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">入り江</text>
<text x="370" y="310" text-anchor="middle" font-size="13" fill="#4A4259">養殖漁業に利用されるが、津波の被害が大きくなりやすい</text>
</svg>
