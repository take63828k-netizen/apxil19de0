<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="780" height="220" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">江戸時代に広まった農具</text>
<rect x="30" y="90" width="220" height="100" rx="12" fill="#B4ECE3"/>
<text x="140.0" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">備中ぐわ</text>
<text x="140.0" y="156" text-anchor="middle" font-size="13" fill="#4A4259">深く耕す</text>
<rect x="280" y="90" width="220" height="100" rx="12" fill="#FFD97D"/>
<text x="390.0" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">千歯こき</text>
<text x="390.0" y="156" text-anchor="middle" font-size="13" fill="#4A4259">脱穀する</text>
<rect x="530" y="90" width="220" height="100" rx="12" fill="#E8A0BF"/>
<text x="640.0" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">唐箕</text>
<text x="640.0" y="156" text-anchor="middle" font-size="13" fill="#4A4259">もみ殻を選別する</text>
</svg>
