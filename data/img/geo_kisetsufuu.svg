<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="680" height="330" fill="#FFFFFF"/>
<text x="370" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">季節風のしくみ（冬と夏）</text>
<rect x="20" y="70" width="200" height="60" rx="12" fill="#C9C4D3"/>
<text x="120.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">冬</text>
<text x="120.0" y="116" text-anchor="middle" font-size="13" fill="#4A4259">大陸→海洋へ</text>
<rect x="240" y="70" width="180" height="90" rx="12" fill="#C9E4FF"/>
<text x="330.0" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">日本海</text>
<text x="330.0" y="130" text-anchor="middle" font-size="13" fill="#4A4259">暖流の上で
水分を含む</text>
<rect x="440" y="70" width="200" height="90" rx="12" fill="#FFD97D"/>
<text x="540.0" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">日本列島</text>
<text x="540.0" y="130" text-anchor="middle" font-size="13" fill="#4A4259">山地にぶつかり
日本海側に雪</text>
<line x1="220" y1="100" x2="225" y2="100" stroke="#4A4259" stroke-width="3"/>
<polygon points="238,100 225,95 225,105" fill="#4A4259"/>
<line x1="420" y1="110" x2="425" y2="110" stroke="#4A4259" stroke-width="3"/>
<polygon points="438,110 425,105 425,115" fill="#4A4259"/>
<rect x="20" y="210" width="200" height="60" rx="12" fill="#C9C4D3"/>
<text x="120.0" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">夏</text>
<text x="120.0" y="256" text-anchor="middle" font-size="13" fill="#4A4259">海洋→大陸へ</text>
<rect x="240" y="210" width="180" height="90" rx="12" fill="#C9E4FF"/>
<text x="330.0" y="251" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">太平洋</text>
<text x="330.0" y="270" text-anchor="middle" font-size="13" fill="#4A4259">暖かく湿った
空気</text>
<rect x="440" y="210" width="200" height="90" rx="12" fill="#E8A0BF"/>
<text x="540.0" y="251" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">日本列島</text>
<text x="540.0" y="270" text-anchor="middle" font-size="13" fill="#4A4259">太平洋側に
雨が多い</text>
<line x1="220" y1="240" x2="225" y2="240" stroke="#4A4259" stroke-width="3"/>
<polygon points="238,240 225,235 225,245" fill="#4A4259"/>
<line x1="420" y1="250" x2="425" y2="250" stroke="#4A4259" stroke-width="3"/>
<polygon points="438,250 425,245 425,255" fill="#4A4259"/>
</svg>
