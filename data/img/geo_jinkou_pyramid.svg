<text x="540" y="280" text-anchor="middle" font-size="13" fill="#4A4259">年少人口が少なく、高齢者が多い</text>
<text x="370" y="310" text-anchor="middle" font-size="13" fill="#4A4259">日本の人口ピラミッドは、少子高齢化により富士山型からつぼ型に変化してきた</text>
