<text x="540" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">つぼ型（少産少死・少子高齢化）</text>
<rect x="505" y="90" width="70" height="10" fill="#E8A0BF"/>
<rect x="501" y="102" width="78" height="10" fill="#E8A0BF"/>
<rect x="498" y="114" width="85" height="10" fill="#E8A0BF"/>
