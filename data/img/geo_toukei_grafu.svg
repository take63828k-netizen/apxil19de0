<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 355" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="355" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">ある地域の人口の変化（模式）</text>
<line x1="100" y1="280" x2="660" y2="280" stroke="#4A4259" stroke-width="2"/>
<rect x="132" y="89" width="77" height="191" fill="#B4ECE3" stroke="#4A4259" stroke-width="1.5"/>
<text x="170.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">1990</text>
<rect x="272" y="102" width="77" height="178" fill="#B4ECE3" stroke="#4A4259" stroke-width="1.5"/>
<text x="310.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">2000</text>
<rect x="412" y="125" width="77" height="155" fill="#FFD97D" stroke="#4A4259" stroke-width="1.5"/>
<text x="450.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">2010</text>
<rect x="552" y="152" width="77" height="128" fill="#E8A0BF" stroke="#4A4259" stroke-width="1.5"/>
<text x="590.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">2020</text>
<text x="370" y="330" text-anchor="middle" font-size="13" fill="#4A4259">長期的に人口が減少する傾向が読み取れる（数値はおおよその傾向を示す）</text>
</svg>
