<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 435" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="435" fill="#FFFFFF"/>
<text x="385" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">アフリカの気候帯の並び（模式）</text>
