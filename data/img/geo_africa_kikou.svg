<rect x="180" y="200" width="410" height="44" rx="12" fill="#E8A0BF"/>
<text x="385.0" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">（A）</text>
<rect x="180" y="250" width="410" height="44" rx="12" fill="#FFC49B"/>
<text x="385.0" y="278" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">サバナ気候</text>
<rect x="180" y="300" width="410" height="44" rx="12" fill="#FFD97D"/>
<text x="385.0" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">砂漠気候（ナミブ・カラハリ砂漠）</text>
