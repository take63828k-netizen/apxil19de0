<text x="150" y="376" text-anchor="end" font-size="16" font-weight="bold" fill="#4A4259">南</text>
<line x1="592" y1="222" x2="640" y2="222" stroke="#4A4259" stroke-width="2" stroke-dasharray="5 4"/>
<text x="646" y="227" text-anchor="start" font-size="14" font-weight="bold" fill="#4A4259">赤道が通る</text>
<text x="385" y="420" text-anchor="middle" font-size="12" fill="#4A4259">※模式図。実際の気候は標高や海流でも変わる</text>
