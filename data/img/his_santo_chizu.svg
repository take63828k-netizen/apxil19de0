<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 220" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="220" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">江戸・大阪・京都（三都）の位置と役割（模式）</text>
<rect x="60" y="90" width="200" height="100" rx="12" fill="#B4ECE3"/>
<text x="160.0" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">江戸</text>
<text x="160.0" y="157" text-anchor="middle" font-size="13" fill="#4A4259">政治の中心（幕府）</text>
<rect x="300" y="90" width="200" height="100" rx="12" fill="#FFD97D"/>
<text x="400.0" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">大阪</text>
<text x="400.0" y="157" text-anchor="middle" font-size="13" fill="#4A4259">商業の中心（天下の台所）</text>
<rect x="540" y="90" width="200" height="100" rx="12" fill="#E8A0BF"/>
<text x="640.0" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">京都</text>
<text x="640.0" y="157" text-anchor="middle" font-size="13" fill="#4A4259">文化の中心（朝廷）</text>
</svg>
