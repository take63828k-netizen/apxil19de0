<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 260" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="260" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">筑紫平野の二毛作（模式）</text>
<rect x="60" y="90" width="300" height="90" rx="12" fill="#B4ECE3"/>
<text x="210.0" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">秋〜冬：小麦などを栽培</text>
<rect x="410" y="90" width="300" height="90" rx="12" fill="#FFD97D"/>
<text x="560.0" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">春〜夏：稲を栽培</text>
<line x1="360" y1="135" x2="395" y2="135" stroke="#4A4259" stroke-width="3"/>
<polygon points="408,135 395,130 395,140" fill="#4A4259"/>
<text x="384.0" y="127.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E6B8C">同じ田で</text>
