<rect x="255" y="125" width="260" height="60" rx="12" fill="#E8A0BF"/>
<text x="385.0" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">中央の役所</text>
<text x="385.0" y="172" text-anchor="middle" font-size="13" fill="#4A4259">二官八省（太政官など）</text>
