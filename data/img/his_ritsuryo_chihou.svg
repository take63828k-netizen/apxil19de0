<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 400" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="400" fill="#FFFFFF"/>
<text x="385" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">律令国家のしくみ（模式）</text>
