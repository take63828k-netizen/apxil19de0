<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 355" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="355" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">長野県産レタスの出荷量の変化（模式）</text>
<line x1="100" y1="280" x2="660" y2="280" stroke="#4A4259" stroke-width="2"/>
<rect x="132" y="240" width="77" height="40" fill="#B4ECE3" stroke="#4A4259" stroke-width="1.5"/>
<text x="170.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">4月</text>
<rect x="272" y="159" width="77" height="121" fill="#FFD97D" stroke="#4A4259" stroke-width="1.5"/>
<text x="310.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">6月</text>
<rect x="412" y="89" width="77" height="191" fill="#FFD97D" stroke="#4A4259" stroke-width="1.5"/>
<text x="450.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">8月</text>
<rect x="552" y="220" width="77" height="60" fill="#B4ECE3" stroke="#4A4259" stroke-width="1.5"/>
<text x="590.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">10月</text>
<text x="370" y="330" text-anchor="middle" font-size="13" fill="#4A4259">夏でも涼しい気候を生かし、夏に出荷を増やしている（おおよその傾向）</text>
</svg>
