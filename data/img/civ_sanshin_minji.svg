<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="600" height="460" fill="#FFFFFF"/>
<text x="300" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#4A4259">民事裁判（地方裁判所から始まる例）</text>
<rect x="200" y="60" width="200" height="60" rx="14" fill="#E8A0BF"/>
<text x="300.0" y="98" text-anchor="middle" font-size="24" font-weight="bold" fill="#4A4259">最高裁判所</text>
