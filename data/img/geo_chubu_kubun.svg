<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 220" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="220" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">中部地方の3つの区分</text>
<rect x="40" y="90" width="220" height="100" rx="12" fill="#B4ECE3"/>
<text x="150.0" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">東海</text>
<text x="150.0" y="157" text-anchor="middle" font-size="13" fill="#4A4259">愛知・静岡など（工業が発達）</text>
<rect x="280" y="90" width="220" height="100" rx="12" fill="#FFD97D"/>
<text x="390.0" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">中央高地</text>
<text x="390.0" y="156" text-anchor="middle" font-size="13" fill="#4A4259">山梨・長野など（高地の農業）</text>
<rect x="520" y="90" width="220" height="100" rx="12" fill="#E8A0BF"/>
<text x="630.0" y="135" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">北陸</text>
<text x="630.0" y="157" text-anchor="middle" font-size="13" fill="#4A4259">新潟・富山など（水田単作）</text>
</svg>
