<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 350" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="350" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">日本銀行の3つの役割</text>
<rect x="280" y="130" width="200" height="90" rx="12" fill="#FFD97D"/>
<text x="380.0" y="181" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">日本銀行</text>
<rect x="40" y="20" width="200" height="80" rx="12" fill="#B4ECE3"/>
<text x="140.0" y="56" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">発券銀行</text>
<text x="140.0" y="76" text-anchor="middle" font-size="13" fill="#4A4259">紙幣を発行する</text>
