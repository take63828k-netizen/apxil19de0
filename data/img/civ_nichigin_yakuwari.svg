<text x="380.0" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">政府の銀行</text>
<text x="380.0" y="306" text-anchor="middle" font-size="13" fill="#4A4259">国の資金を管理</text>
