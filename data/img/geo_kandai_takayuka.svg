<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 385" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="385" fill="#FFFFFF"/>
<text x="385" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">寒帯地方の高床式住居（模式）</text>
<rect x="60" y="250" width="650" height="90" fill="#BFD7E6" stroke="#4A4259" stroke-width="2"/>
<text x="385" y="310" text-anchor="middle" font-size="20" font-weight="bold" fill="#4A4259">永久凍土</text>
<polygon points="250,130 385,70 520,130" fill="#FFC49B" stroke="#4A4259" stroke-width="2"/>
<rect x="260" y="130" width="250" height="70" fill="#FFD97D" stroke="#4A4259" stroke-width="2"/>
<text x="385" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">住居（暖房あり）</text>
<line x1="275" y1="200" x2="275" y2="250" stroke="#4A4259" stroke-width="6"/>
<line x1="385" y1="200" x2="385" y2="250" stroke="#4A4259" stroke-width="6"/>
<line x1="495" y1="200" x2="495" y2="250" stroke="#4A4259" stroke-width="6"/>
<text x="385" y="232" text-anchor="middle" font-size="13" fill="#4A4259">床下の空間</text>
<text x="385" y="365" text-anchor="middle" font-size="13" fill="#4A4259">高床にしないと、暖房の熱で地面の氷がとけてしまう</text>
</svg>
