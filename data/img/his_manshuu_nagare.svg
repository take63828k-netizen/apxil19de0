<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 240" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="240" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">満州事変後の日本の動き</text>
