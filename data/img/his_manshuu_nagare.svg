<polygon points="215,155 202,150 202,160" fill="#4A4259"/>
<rect x="215" y="110" width="165" height="90" rx="12" fill="#FFD97D"/>
<text x="297.5" y="151" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">満州国建国</text>
<text x="297.5" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">（1932年）</text>
<line x1="380" y1="155" x2="387" y2="155" stroke="#4A4259" stroke-width="3"/>
