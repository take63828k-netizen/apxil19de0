<text x="667.5" y="151" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">国際連盟脱退</text>
<text x="667.5" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">（1933年）</text>
