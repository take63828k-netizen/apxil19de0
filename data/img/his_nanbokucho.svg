<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 270" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="270" fill="#FFFFFF"/>
<text x="385" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">南北朝時代の2つの朝廷（模式）</text>
<rect x="40" y="80" width="320" height="120" rx="12" fill="#C9E4FF"/>
<text x="200.0" y="134" text-anchor="middle" font-size="20" font-weight="bold" fill="#4A4259">京都</text>
<text x="200.0" y="160" text-anchor="middle" font-size="13" fill="#4A4259">北朝：足利尊氏が立てた天皇</text>
<text x="385" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#4A4259">vs</text>
<rect x="410" y="80" width="320" height="120" rx="12" fill="#FFD97D"/>
<text x="570.0" y="134" text-anchor="middle" font-size="22" font-weight="bold" fill="#4A4259">（A）</text>
<text x="570.0" y="161" text-anchor="middle" font-size="13" fill="#4A4259">南朝：後醍醐天皇が逃れた</text>
<text x="385" y="245" text-anchor="middle" font-size="14" fill="#4A4259">1392年、足利義満が南北朝を合一した</text>
