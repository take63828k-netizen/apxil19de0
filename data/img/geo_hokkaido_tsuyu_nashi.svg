<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 230" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="230" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">北海道の気候の特徴（模式）</text>
<rect x="60" y="90" width="300" height="110" rx="12" fill="#B4ECE3"/>
<text x="210.0" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A4259">冷帯（亜寒帯）気候</text>
<text x="210.0" y="159" text-anchor="middle" font-size="13" fill="#4A4259">夏は涼しく、冬は寒さが厳しい</text>
<rect x="410" y="90" width="300" height="110" rx="12" fill="#FFD97D"/>
<text x="560.0" y="141" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">梅雨がない</text>
<text x="560.0" y="161" text-anchor="middle" font-size="13" fill="#4A4259">梅雨前線の影響を受けにくい</text>
</svg>
