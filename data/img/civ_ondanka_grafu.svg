<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 355" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="355" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#4A4259">世界の平均気温の変化（模式）</text>
<line x1="100" y1="280" x2="660" y2="280" stroke="#4A4259" stroke-width="2"/>
<polyline points="100,235 287,205 473,145 660,70" fill="none" stroke="#E8A0BF" stroke-width="4"/>
<text x="100.0" y="302" text-anchor="middle" font-size="12" fill="#4A4259">1900</text>
<text x="286.66666666666663" y="302" text-anchor="middle" font-size="12" fill="#4A4259">1950</text>
<text x="473.3333333333333" y="302" text-anchor="middle" font-size="12" fill="#4A4259">2000</text>
<text x="660.0" y="302" text-anchor="middle" font-size="12" fill="#4A4259">2020</text>
<text x="370" y="330" text-anchor="middle" font-size="13" fill="#4A4259">世界の平均気温は長期的に上昇する傾向にある（数値はおおよその傾向）</text>
</svg>
