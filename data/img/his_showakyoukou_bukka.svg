<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 355" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="355" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">昭和恐慌期の農産物価格の変化（模式）</text>
<line x1="90" y1="280" x2="670" y2="280" stroke="#4A4259" stroke-width="2"/>
<polyline points="90,100 283,112 477,172 670,160" fill="none" stroke="#B4ECE3" stroke-width="4"/>
<polyline points="90,130 283,148 477,232 670,220" fill="none" stroke="#E8A0BF" stroke-width="4"/>
<text x="90.0" y="302" text-anchor="middle" font-size="12" fill="#4A4259">1926</text>
<text x="283.33333333333337" y="302" text-anchor="middle" font-size="12" fill="#4A4259">1928</text>
<text x="476.6666666666667" y="302" text-anchor="middle" font-size="12" fill="#4A4259">1930</text>
<text x="670.0" y="302" text-anchor="middle" font-size="12" fill="#4A4259">1932</text>
<text x="130" y="50" text-anchor="start" font-size="13" font-weight="bold" fill="#2E8B7A">米価</text>
<text x="240" y="50" text-anchor="start" font-size="13" font-weight="bold" fill="#B23A48">繭価（生糸の原料）</text>
<text x="370" y="330" text-anchor="middle" font-size="12" fill="#4A4259">世界恐慌の影響で農産物価格が暴落し、農村は深刻な不況となった（数値はおおよその傾向）</text>
</svg>
