<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 355" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="355" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">日本の輸出額の変化（第一次世界大戦期・模式）</text>
<line x1="80" y1="280" x2="680" y2="280" stroke="#4A4259" stroke-width="2"/>
<rect x="102" y="219" width="55" height="61" fill="#C9C4D3" stroke="#4A4259" stroke-width="1.5"/>
<text x="130.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">1913</text>
<rect x="202" y="222" width="55" height="58" fill="#B4ECE3" stroke="#4A4259" stroke-width="1.5"/>
<text x="230.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">1914</text>
<rect x="302" y="211" width="55" height="69" fill="#B4ECE3" stroke="#4A4259" stroke-width="1.5"/>
<text x="330.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">1915</text>
<rect x="402" y="155" width="55" height="125" fill="#E8A0BF" stroke="#4A4259" stroke-width="1.5"/>
<text x="430.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">1916</text>
<rect x="502" y="124" width="55" height="156" fill="#E8A0BF" stroke="#4A4259" stroke-width="1.5"/>
<text x="530.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">1917</text>
<rect x="602" y="89" width="55" height="191" fill="#FFD97D" stroke="#4A4259" stroke-width="1.5"/>
<text x="630.0" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A4259">1918</text>
<text x="370" y="330" text-anchor="middle" font-size="13" fill="#4A4259">大戦景気により輸出額が大きく増えた（数値はおおよその傾向を示す）</text>
</svg>
