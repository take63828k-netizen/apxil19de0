<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 350" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="350" fill="#FFFFFF"/>
<text x="385" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">邪馬台国と魏の関係（模式）</text>
<rect x="30" y="70" width="210" height="130" rx="12" fill="#B4ECE3"/>
<text x="135.0" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#4A4259">邪馬台国</text>
<text x="135.0" y="154" text-anchor="middle" font-size="13" fill="#4A4259">30ほどの国をまとめた女王</text>
<rect x="530" y="70" width="210" height="130" rx="12" fill="#C9E4FF"/>
<text x="635.0" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#4A4259">魏（中国）</text>
<text x="635.0" y="154" text-anchor="middle" font-size="13" fill="#4A4259">中国の王朝</text>
<line x1="245" y1="110" x2="512" y2="110" stroke="#4A4259" stroke-width="3"/>
<polygon points="525,110 512,105 512,115" fill="#4A4259"/>
<text x="385.0" y="102.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E6B8C">使いを送る</text>
<line x1="525" y1="165" x2="258" y2="165" stroke="#4A4259" stroke-width="3"/>
<polygon points="245,165 258,170 258,160" fill="#4A4259"/>
<text x="385.0" y="157.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E6B8C">称号や銅鏡などを与える</text>
<rect x="250" y="225" width="270" height="70" rx="12" fill="#FFD97D"/>
<text x="385.0" y="254" text-anchor="middle" font-size="20" font-weight="bold" fill="#4A4259">（A）</text>
<text x="385.0" y="280" text-anchor="middle" font-size="13" fill="#4A4259">魏の皇帝が与えた、倭の王の称号</text>
<text x="385" y="330" text-anchor="middle" font-size="13" fill="#4A4259">中国の歴史書『魏志』倭人伝に書かれている</text>
</svg>
