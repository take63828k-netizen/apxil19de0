<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 290" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="770" height="290" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">為替相場の変化（円高・円安）</text>
<rect x="80" y="90" width="260" height="100" rx="12" fill="#B4ECE3"/>
<text x="210.0" y="146" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">1ドル＝100円</text>
<rect x="430" y="90" width="260" height="100" rx="12" fill="#E8A0BF"/>
<text x="560.0" y="146" text-anchor="middle" font-size="18" font-weight="bold" fill="#4A4259">1ドル＝80円</text>
<line x1="340" y1="140" x2="415" y2="140" stroke="#4A4259" stroke-width="3"/>
<polygon points="428,140 415,135 415,145" fill="#4A4259"/>
<text x="384.0" y="132.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E6B8C">円高</text>
<text x="370" y="230" text-anchor="middle" font-size="14" fill="#4A4259">1ドルに必要な円が少なくなる＝円の価値が上がる（円高）</text>
<text x="370" y="260" text-anchor="middle" font-size="13" fill="#C9C4D3">逆に、1ドル＝120円になる場合は円安</text>
</svg>
