<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 230" font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">
<rect width="790" height="230" fill="#FFFFFF"/>
<text x="370" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">日米修好通商条約の不平等な内容</text>
<rect x="60" y="90" width="300" height="110" rx="12" fill="#E8A0BF"/>
<text x="210.0" y="141" text-anchor="middle" font-size="16" font-weight="bold" fill="#4A4259">関税自主権がない</text>
<text x="210.0" y="161" text-anchor="middle" font-size="13" fill="#4A4259">輸入品の税率を自国で決められない</text>
<rect x="410" y="90" width="300" height="110" rx="12" fill="#FFD97D"/>
<text x="560.0" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A4259">領事裁判権を認める</text>
<text x="560.0" y="160" text-anchor="middle" font-size="13" fill="#4A4259">外国人を日本の法律で裁けない</text>
</svg>
